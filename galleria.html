<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soggettoni — Le nuove leve</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --arancio:#f5872e; --oro:#ffc90e; --rosso:#ee3b24;
    --fondo:#191715; --pannello:#231f1c; --bordo:#3d3733;
    --testo:#f3ece3; --testo2:#a2968a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--testo);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(25,23,21,.94);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--bordo);padding:14px 20px}
  .barra{max-width:1240px;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  h1 span{color:var(--arancio)}
  #conta{color:var(--testo2);font-size:13px;white-space:nowrap}
  #cerca{flex:1;min-width:180px;padding:8px 12px;background:#2c2724;border:1px solid var(--bordo);
         border-radius:8px;color:var(--testo);font:inherit}
  #cerca:focus{outline:2px solid var(--arancio);outline-offset:-1px}
  #filtri{max-width:1240px;margin:10px auto 0;display:flex;gap:7px;flex-wrap:wrap}
  .chip{background:#2c2724;border:1px solid var(--bordo);color:var(--testo2);border-radius:20px;
        padding:5px 13px;font-size:12.5px;cursor:pointer}
  .chip:hover{border-color:var(--arancio);color:var(--testo)}
  .chip.on{background:var(--arancio);border-color:var(--arancio);color:#241a10;font-weight:700}

  main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  #griglia{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  figure{margin:0;cursor:zoom-in}
  figure img{width:100%;display:block;border-radius:9px;background:#2c2724;
             box-shadow:0 6px 18px #0007;transition:transform .12s ease, box-shadow .12s ease}
  figure:hover img{transform:translateY(-3px);box-shadow:0 12px 26px #0009}
  figcaption{font-size:12.5px;color:var(--testo2);margin-top:7px;line-height:1.3;
             display:flex;gap:6px;align-items:baseline}
  figcaption b{color:var(--testo);font-weight:600}
  figcaption i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.6}
  #vuoto{color:var(--testo2);padding:40px 0;text-align:center;display:none}

  #lente{position:fixed;inset:0;background:#000d;z-index:50;display:none;
         align-items:center;justify-content:center;padding:24px}
  #lente.on{display:flex}
  .scheda{display:flex;gap:26px;align-items:flex-start;max-width:1000px;width:100%;
          max-height:92vh}
  .scheda img{max-height:88vh;width:auto;max-width:60%;border-radius:12px;box-shadow:0 20px 50px #000b}
  .info{background:var(--pannello);border:1px solid var(--bordo);border-radius:12px;padding:18px 20px;
        max-width:400px;max-height:88vh;overflow:auto}
  .info h2{margin:0 0 2px;font-size:22px;line-height:1.2}
  .info .rar{color:var(--arancio);font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;
             font-weight:700;margin-bottom:14px}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 14px;font-size:14px}
  .info dt{color:var(--testo2)}
  .info dd{margin:0;font-variant-numeric:tabular-nums}
  .info p{margin:0;font-size:14px;color:#e2d8cc;border-top:1px solid var(--bordo);padding-top:12px}
  .pip{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:3px;
       background:#4a4340;vertical-align:middle}
  .pip.p{background:var(--rosso)} .pip.o{background:var(--oro)}
  .pip.a1{background:#e2231a}.pip.a2{background:#f39200}.pip.a3{background:#ffde00}
  .pip.a4{background:#009e49}.pip.a5{background:#0074bc}
  #chiudi{position:fixed;top:16px;right:20px;background:none;border:0;color:var(--testo);
          font-size:30px;line-height:1;cursor:pointer;opacity:.7}
  #chiudi:hover{opacity:1}
  @media(max-width:820px){
    .scheda{flex-direction:column;overflow:auto}
    .scheda img{max-width:100%;max-height:60vh}
    .info{max-width:100%}
  }
  footer{max-width:1240px;margin:0 auto;padding:0 20px 40px;color:var(--testo2);font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="barra">
    <h1>Soggettoni <span>· Le nuove leve</span></h1>
    <span id="conta"></span>
    <input id="cerca" type="search" placeholder="Cerca un soggettone…" autocomplete="off">
  </div>
  <div id="filtri"></div>
</header>

<main>
  <div id="griglia"></div>
  <div id="vuoto">Nessun soggettone con questo nome.</div>
</main>

<footer id="piede"></footer>

<div id="lente"><button id="chiudi" title="Chiudi">&times;</button><div class="scheda" id="scheda"></div></div>

<script>
"use strict";
const NOMI = ['Forza','Agilità','Intelligenza','Incazzamento','Arrapamento','Ubriachezza'];
const RARITA = ['Comune','Discretamente raro','Decisamente raro','Fottutamente raro','Introvabile'];
let carte = [], filtro = null;

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function quadretti(v){
  if(v >= 7) return [1,2,3,4,5].map(i=>`<span class="pip a${i}"></span>`).join('');
  if(v === 6) return '<span class="pip o"></span>'.repeat(5);
  return '<span class="pip p"></span>'.repeat(v) + '<span class="pip"></span>'.repeat(5-v);
}

function mostra(){
  const q = $('#cerca').value.trim().toLowerCase();
  const viste = carte.filter(c =>
    (!filtro || c.rarita === filtro) &&
    (!q || c.nome.toLowerCase().includes(q) || String(c.num).includes(q)));
  $('#griglia').innerHTML = viste.map((c,i) => `
    <figure data-i="${carte.indexOf(c)}">
      <img loading="lazy" src="${esc(c.img)}" alt="${esc(c.nome)}" width="560" height="865">
      <figcaption><i>${esc(c.num)}</i><b>${esc(c.nome)}</b></figcaption>
    </figure>`).join('');
  $('#vuoto').style.display = viste.length ? 'none' : 'block';
  $('#conta').textContent = viste.length === carte.length
      ? `${carte.length} carte` : `${viste.length} di ${carte.length}`;
}

function apri(i){
  const c = carte[i];
  $('#scheda').innerHTML = `
    <img src="${esc(c.img)}" alt="${esc(c.nome)}">
    <div class="info">
      <h2>${esc(c.nome)}</h2>
      <div class="rar">${esc(c.rarita)} · carta ${esc(c.num)}</div>
      <dl>
        <dt>Ignoranza</dt><dd>${esc(c.ign)}/100</dd>
        ${c.val.map((v,k)=>`<dt>${NOMI[k]}</dt><dd>${quadretti(v)}</dd>`).join('')}
      </dl>
      ${c.testo ? `<p>${esc(c.testo)}</p>` : ''}
    </div>`;
  $('#lente').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function chiudi(){ $('#lente').classList.remove('on'); document.body.style.overflow = ''; }

$('#griglia').addEventListener('click', e => {
  const f = e.target.closest('figure');
  if(f) apri(+f.dataset.i);
});
$('#lente').addEventListener('click', e => { if(e.target.id !== 'scheda' && !e.target.closest('.info')) chiudi(); });
$('#chiudi').onclick = chiudi;
document.addEventListener('keydown', e => { if(e.key === 'Escape') chiudi(); });
$('#cerca').oninput = mostra;

(async function(){
  const r = await fetch('galleria/carte.json', {cache:'no-cache'});
  const dati = await r.json();
  carte = dati.carte;
  const chips = ['Tutte', ...RARITA.filter(r => carte.some(c => c.rarita === r))];
  $('#filtri').innerHTML = chips.map(n =>
    `<button class="chip${n==='Tutte'?' on':''}" data-r="${n==='Tutte'?'':esc(n)}">${esc(n)}</button>`).join('');
  $('#filtri').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
    filtro = b.dataset.r || null; mostra();
  });
  $('#piede').textContent = 'Espansione "Le nuove leve" — aggiornata al ' +
      new Date(dati.aggiornato).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}) + '.';
  mostra();
})();
</script>
</body>
</html>
